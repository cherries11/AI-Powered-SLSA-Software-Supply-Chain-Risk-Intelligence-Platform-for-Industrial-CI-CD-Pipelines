name: Python CI + SLSA Level 3

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4
        # SHA from https://github.com/actions/checkout/releases/tag/v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 .

      - name: Set environment
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV    

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest pytest-cov
          PYTHONPATH=. pytest tests/ \
             --ignore=test.txt \
             --cov=backend \
             --cov-report=xml \
             -W ignore::DeprecationWarning

      - name: Upload code coverage
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de  # ratchet:codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  docker:
    name: Build Docker image
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t my-app:latest .
          docker tag my-app:latest ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@17ae1740179002c89186b61233e0f892c3118b11  # ratchet:anchore/sbom-action/download-syft@v0.22.2

      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Generate SBOM
        run: |
          syft ${{ secrets.DOCKER_USERNAME }}/my-app:latest -o spdx-json > sbom.json
          cat sbom.json

  provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Generate SLSA provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # ratchet:actions/attest@v4
        with:
          subject-name: my-app:latest
          subject-digest: ${{ steps.build.outputs.digest }}  # you'll need to capture digest from docker build
          push-to-registry: true

  verify:
    name: Verify SBOM & Provenance
    runs-on: ubuntu-22.04
    needs: [sbom, provenance]
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # ratchet:sigstore/cosign-installer@v4.0.0

      - name: Verify Docker Image Attestation
        run: |
          cosign verify-attestation --key cosign.pub my-app:latest

      - name: Verify SBOM Integrity
        run: |
          slsa-verifier verify-artifacts ./provenance.json --materials ./sbom.json

  sign-docker:
    name: Sign Docker Image
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # ratchet:sigstore/cosign-installer@v4.0.0

      - name: Sign Docker Image
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY my-app:latest

  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-22.04
    needs: [sbom, provenance, sign-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # ratchet:softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # ratchet:actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sbom.json
          asset_name: sbom.json
          asset_content_type: application/json

      - name: Upload Provenance
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # ratchet:actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./provenance.json
          asset_name: provenance.json
          asset_content_type: application/json