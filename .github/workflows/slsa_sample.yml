name: Python CI + SLSA Level 3

permissions:
  id-token: write          # Required for keyless signing & attestations
  contents: read           # Required for checkout
  packages: write          # Required for pushing to GHCR (if used)
  attestations: write      # For SLSA attestations

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (report only, non-fatal)
        run: |
          pip install flake8
          flake8 . --exit-zero || true

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pytest pytest-cov
          PYTHONPATH=. pytest tests/ \
            --ignore=test.txt \
            --cov=backend \
            --cov-report=xml \
            -W ignore::DeprecationWarning || true  # non-fatal

      - name: Upload code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false  # Don't block on coverage upload

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    needs: build
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/my-app:latest
          outputs: type=image,name=ghcr.io/${{ github.repository }}/my-app:latest,push=true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.22.2

      - name: Generate SBOM
        run: |
          syft ghcr.io/${{ github.repository }}/my-app:latest@${{ needs.docker.outputs.digest }} \
            -o spdx-json > sbom.json
          cat sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  provenance:
    name: Generate SLSA Provenance (Level 3)
    runs-on: ubuntu-22.04
    needs: docker
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SLSA Provenance
        uses: slsa-framework/slsa-github-generator@v2
        with:
          artifact-path: ghcr.io/${{ github.repository }}/my-app:latest@${{ needs.docker.outputs.digest }}
          # Optional: if you want to push provenance to GHCR
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  sign-docker:
    name: Sign Docker Image (Keyless)
    runs-on: ubuntu-22.04
    needs: docker
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Docker Image (Keyless)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/my-app:latest@${{ needs.docker.outputs.digest }}

  verify:
    name: Verify SBOM & Provenance
    runs-on: ubuntu-22.04
    needs: [sbom, provenance]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Verify Docker Image Attestation
        run: |
          cosign verify ghcr.io/${{ github.repository }}/my-app:latest@${{ needs.docker.outputs.digest }}

      - name: Verify SBOM Integrity
        run: |
          slsa-verifier verify-artifacts ./provenance.json --materials ./sbom.json

  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-22.04
    needs: [sbom, provenance, sign-docker]
    if: startsWith(github.ref, 'refs/tags/')  # Only run on tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Upload SBOM
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: sbom.json
          asset_name: sbom.json
          asset_content_type: application/json

      - name: Upload Provenance
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: provenance.json
          asset_name: provenance.json
          asset_content_type: application/json
