name: Python CI + SLSA

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run lint
      - name: Lint
        run: |
          pip install flake8
          flake8 .

      # 5️⃣ Run tests
      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest --cov=./

      # 6️⃣ Upload code coverage
      - name: Upload Code Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  docker:
    name: Build Docker image
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t my-app:latest .

      - name: Test Docker container (optional)
        run: |
          docker run --rm my-app:latest streamlit --version

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.22.2

      - name: Generate SBOM
        run: |
          syft my-app:latest -o spdx-json > sbom.json
          cat sbom.json

  provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: 'v2.4.3'

      - name: Generate SLSA provenance
        uses: slsa-framework/actions/attest-build-provenance@v1
        with:
          type: https://slsa.dev/provenance/v0.2
          material-path: .
          builder-id: "github.com/${{ github.repository }}/python-streamlit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show attestation
        run: cat ./provenance.json