name: Python CI + SLSA Level 3

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4
        # SHA from https://github.com/actions/checkout/releases/tag/v4.2.2

      - name: Set up Python
        uses: actions/setup-python@39cd14951b8d7c6a56d3e2d4c4c0e0e0e0e0e0e0  # ratchet:actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 .

      - name: Run tests
        run: |
          pip install pytest pytest-cov
          pytest --cov=./ --cov-report=xml

      - name: Upload code coverage
        uses: codecov/codecov-action@e8a0a41d3c9e0e0e0e0e0e0e0e0e0e0e0e0e0e0e  # ratchet:codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  docker:
    name: Build Docker image
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-app:latest .

      - name: Test Docker container
        run: |
          docker run --rm my-app:latest python --version

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0  # ratchet:anchore/sbom-action/download-syft@v0.22.2

      - name: Generate SBOM
        run: |
          syft my-app:latest -o spdx-json > sbom.json
          cat sbom.json

  provenance:
    name: Generate SLSA Provenance
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Generate SLSA provenance
        uses: actions/attest@8f3b4c6a5f8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d  # ratchet:actions/attest@v4
        with:
          subject-name: my-app:latest
          subject-digest: ${{ steps.build.outputs.digest }}  # you'll need to capture digest from docker build
          push-to-registry: true

  verify:
    name: Verify SBOM & Provenance
    runs-on: ubuntu-22.04
    needs: [sbom, provenance]
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # ratchet:sigstore/cosign-installer@v4.0.0

      - name: Verify Docker Image Attestation
        run: |
          cosign verify-attestation --key cosign.pub my-app:latest

      - name: Verify SBOM Integrity
        run: |
          slsa-verifier verify-artifacts ./provenance.json --materials ./sbom.json

  sign-docker:
    name: Sign Docker Image
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # ratchet:sigstore/cosign-installer@v4.0.0

      - name: Sign Docker Image
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY my-app:latest

  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-22.04
    needs: [sbom, provenance, sign-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a6f3d6c9b0a8d7e0f0e0e0e0e0e0e0  # ratchet:softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        uses: actions/upload-release-asset@e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0  # ratchet:actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sbom.json
          asset_name: sbom.json
          asset_content_type: application/json

      - name: Upload Provenance
        uses: actions/upload-release-asset@e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0  # ratchet:actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./provenance.json
          asset_name: provenance.json
          asset_content_type: application/json