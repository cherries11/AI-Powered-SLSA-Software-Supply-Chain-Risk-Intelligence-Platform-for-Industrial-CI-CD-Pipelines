name: Python CI + SLSA Level 3

permissions:
  id-token: write   # required for keyless signing & attest
  contents: read    # required for checkout
  packages: write 
  attestations: write


on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # ratchet:actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 .

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pytest pytest-cov
          PYTHONPATH=. pytest tests/ \
            --ignore=test.txt \
            --cov=backend \
            --cov-report=xml \
            -W ignore::DeprecationWarning

      - name: Upload code coverage
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de  # ratchet:codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  docker:
    name: Build Docker image
    runs-on: ubuntu-22.04
    needs: build
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image + debug digest
        id: build
        run: |
          echo "Building image..."
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest .

          echo "Pushing image..."
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest || { echo "Push failed!"; exit 1; }

          echo "Waiting 5s for registry propagation..."
          sleep 5

          echo "Inspecting image for digest..."
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ secrets.DOCKER_USERNAME }}/my-app:latest | cut -d'@' -f2 || echo "")

          if [ -z "$DIGEST" ]; then
            echo "RepoDigests empty — trying fallback method..."
            DIGEST=$(docker image ls --digests --format '{{.Digest}}' ${{ secrets.DOCKER_USERNAME }}/my-app:latest | head -n1 || echo "")
          fi

          echo "Final digest value: $DIGEST"

          if [ -z "$DIGEST" ]; then
            echo "Error: No digest found after push and fallback!" >&2
            docker images
            exit 1
          fi

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT


  sbom:
    name: Generate SBOM
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@17ae1740179002c89186b61233e0f892c3118b11  # ratchet:anchore/sbom-action/download-syft@v0.22.2

      - name: Generate SBOM
        run: |
          syft ${{ secrets.DOCKER_USERNAME }}/my-app:latest -o spdx-json > sbom.json
          cat sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  provenance:
    name: Generate SLSA Provenance (Level 3)
    runs-on: ubuntu-22.04
    needs: docker
    permissions:
      id-token: write     # for keyless signing
      contents: read
      packages: write     # for pushing OCI artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate & push SLSA Provenance
        uses: slsa-framework/slsa-github-generator@v2.0.0
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/my-app:latest@${{ needs.docker.outputs.digest }}
          registry-username: ${{ secrets.DOCKER_USERNAME }}
          registry-password: ${{ secrets.DOCKER_PASSWORD }}

  sign-docker:
    name: Sign Docker Image (Keyless)
    runs-on: ubuntu-22.04
    needs: docker
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # ratchet:sigstore/cosign-installer@v4.0.0

      - name: Sign Docker Image (Keyless)
        run: |
          cosign sign ${{ secrets.DOCKER_USERNAME }}/my-app:latest

  verify:
    name: Verify SBOM & Provenance
    runs-on: ubuntu-22.04
    needs: [sbom, provenance]
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # ratchet:sigstore/cosign-installer@v4.0.0

      - name: Verify Docker Image Attestation
        run: |
          cosign verify ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Verify SBOM Integrity
        run: |
          slsa-verifier verify-artifacts ./provenance.json --materials ./sbom.json

  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-22.04
    needs: [sbom, provenance, sign-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # ratchet:actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # ratchet:softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # ratchet:actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./sbom.json
          asset_name: sbom.json
          asset_content_type: application/json

      - name: Upload Provenance
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5  # ratchet:actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./provenance.json
          asset_name: provenance.json
          asset_content_type: application/json